name: Isolated CDP startup observation (once)
on:
  push:
    branches:
      - diag/cdp-isolated-once-20261118-b651ddd
permissions:
  contents: read
concurrency:
  group: pagebench-cdp-isolated-once-20261118-b651ddd
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/diag/cdp-isolated-once-20261118-b651ddd' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Synthetic and loopback-only tests
        run: |
          node --check tools/cdp-startup-diagnostic/diagnostic.mjs
          node --check tools/cdp-startup-diagnostic/cleanup.mjs
          node --test tools/cdp-startup-diagnostic/*.test.mjs
      - name: Bind one paused target by createTarget response ID
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: |
          node --input-type=module <<'JS'
          import {main} from './tools/cdp-startup-diagnostic/diagnostic.mjs';
          import {ResponseBoundObserver} from './tools/cdp-startup-diagnostic/response-bound.mjs';
          import {writeFile,appendFile} from 'node:fs/promises';
          let result;
          try { result=await main(ResponseBoundObserver); }
          catch { result={status:'failed',code:'DIAGNOSTIC_INTERNAL_FAILED'}; }
          const text=JSON.stringify(result);
          await writeFile('response-binding-result.json',text,{mode:0o600});
          console.log(text);
          await appendFile(process.env.GITHUB_STEP_SUMMARY,'```json\n'+text+'\n```\n');
          if(result.status!=='success'||result.response_id_bound!==true)process.exitCode=1;
          JS
      - name: Fixed-enum binding result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-response-binding-result
          path: response-binding-result.json
          retention-days: 3
          if-no-files-found: ignore
