name: Isolated CDP startup observation (once)
on:
  push:
    branches:
      - diag/cdp-isolated-once-20261118-b651ddd
permissions:
  contents: read
concurrency:
  group: pagebench-cdp-isolated-once-20261118-b651ddd
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/diag/cdp-isolated-once-20261118-b651ddd' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Synthetic and loopback-only tests
        run: |
          node --check tools/cdp-startup-diagnostic/diagnostic.mjs
          node --check tools/cdp-startup-diagnostic/cleanup.mjs
          node --test tools/cdp-startup-diagnostic/*.test.mjs
      - name: One-factor isolated autoattach comparisons
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node tools/cdp-startup-diagnostic/operation-comparison.mjs
      - name: Fixed-enum operation comparison only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-operation-comparison
          path: operation-comparison.json
          retention-days: 3
          if-no-files-found: ignore
