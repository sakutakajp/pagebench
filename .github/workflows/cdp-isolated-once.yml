name: Guarded staging retry after isolated response-path proof
on:
  push:
    branches:
      - diag/cdp-isolated-once-20261118-b651ddd
permissions:
  contents: read
concurrency:
  group: pagebench-cdp-isolated-once-20261118-b651ddd
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/diag/cdp-isolated-once-20261118-b651ddd' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Synthetic and loopback-only tests
        run: |
          node --check tools/cdp-startup-diagnostic/diagnostic.mjs
          node --check tools/cdp-startup-diagnostic/cleanup.mjs
          node --test tools/cdp-startup-diagnostic/*.test.mjs
      - name: Compare global page capture and response-scoped capture
        id: capture
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: |
          node tools/cdp-startup-diagnostic/scoped-comparison.mjs
          node --input-type=module <<'JS'
          import {readFile,appendFile} from 'node:fs/promises';
          const data=JSON.parse(await readFile('scoped-capture-comparison.json','utf8'));
          const ready=data.summary.version_comparability==='SAME_VERSION'&&data.summary.safe_fixture_modes.includes('ROOT_PAGE');
          await appendFile(process.env.GITHUB_OUTPUT,'fixture_ready='+ready+'\n');
          JS
      - name: Locked fixture-only dependencies
        if: steps.capture.outputs.fixture_ready == 'true'
        working-directory: tools/lighthouse-once
        run: npm ci --ignore-scripts
      - name: Mandatory isolated real-Chrome guards then one local Lighthouse report
        if: steps.capture.outputs.fixture_ready == 'true'
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node tools/cdp-startup-diagnostic/fixture-runner.mjs
      - name: Live policy in real Chrome with memory responses and zero forwarding
        if: steps.capture.outputs.fixture_ready == 'true'
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node tools/cdp-startup-diagnostic/staging-memory.mjs
      - name: Actual request and response path on closed loopback fixture
        if: steps.capture.outputs.fixture_ready == 'true'
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node tools/cdp-startup-diagnostic/response-fixture.mjs
      - name: One authorized staging ja retry after all isolated gates
        if: >-
          success() && steps.capture.outputs.fixture_ready == 'true' &&
          github.event_name == 'push' && github.run_attempt == 1 &&
          github.event.head_commit.message == 'diagnostic: staging ja retry after response proof (20261118-b1)'
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node tools/cdp-startup-diagnostic/staging-once.mjs --execute
      - name: Fixed-enum capture comparison only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarded-staging-retry-response-proof
          path: |
            scoped-capture-comparison.json
            fixture-lighthouse-status.json
            fixture-lighthouse-summary.json
            fixture-lighthouse.lhr.json
            staging-memory-proof.json
            response-path-proof.json
            staging-lighthouse-status.json
            staging-lighthouse-report.json
          retention-days: 3
          if-no-files-found: ignore
