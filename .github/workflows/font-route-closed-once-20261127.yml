name: One-time observed closed font route comparison
on:
  push:
    branches: [diag/font-route-closed-once-20261127]
    paths: [.github/workflows/font-route-closed-once-20261127.yml]
permissions:
  contents: read
concurrency:
  group: pagebench-font-route-closed-once-20261127
  cancel-in-progress: false
jobs:
  closed:
    if: >-
      github.repository == 'sakutakajp/pagebench' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diag/font-route-closed-once-20261127' &&
      github.run_attempt == 1 &&
      github.event.created == true &&
      github.event.forced == false &&
      github.event.deleted == false &&
      github.event.head_commit.message == 'diagnostic: observed closed font transport once (20261127-ao1)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Existing locked dependencies without scripts or browser download
        working-directory: tools/lighthouse-once
        run: npm ci --ignore-scripts
      - name: Node24 original and observer controls
        run: node tools/font-route-closed/unit.mjs node24 >/dev/null 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Node22 original and observer controls
        run: node tools/font-route-closed/unit.mjs node22 >/dev/null 2>&1
      - name: Exact admission then separate Node and unchanged guarded native receipts
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node --unhandled-rejections=strict tools/font-route-closed/entry.mjs --closed-once >/dev/null 2>&1
      - name: Fixed evidence only even on failure
        if: always()
        run: node tools/font-route-closed/entry.mjs --publish 2>/dev/null
      - name: Fixed counters and enum receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-route-closed-fixed-20261127-ao1
          retention-days: 1
          if-no-files-found: error
          path: |
            font-route-units.json
            font-route-fixed.json
