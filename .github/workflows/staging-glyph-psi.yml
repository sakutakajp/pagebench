name: Staging glyph mobile PSI (max 2)
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Measure the two staging glyph pages with mobile PSI
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pagebench-staging-glyph-psi
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic tests
        run: python3 -m unittest discover -s tests -v
      - name: Pin staging sitemap and preflight two HTML pages (no key)
        env:
          SITEMAP_URL: ${{ vars.SITEMAP_URL }}
        run: python3 staging_glyph_pilot.py prepare --plan "$RUNNER_TEMP/glyph-plan.json"
      - name: Explicit mobile PSI (max two calls, no retry)
        if: ${{ inputs.execute }}
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python3 staging_glyph_pilot.py execute --plan "$RUNNER_TEMP/glyph-plan.json" --checkpoint "$RUNNER_TEMP/glyph-result.json"
