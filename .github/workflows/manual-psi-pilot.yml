name: Manual mobile PSI pilot (max 3)
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Send at most three real mobile PSI requests (otherwise plan only)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pagebench-manual-psi-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic tests
        run: python3 -m unittest discover -s tests -v
      - name: Plan only (zero PSI calls)
        if: ${{ !inputs.execute }}
        run: python3 psi_pilot.py
      - name: Explicit real pilot (max three calls, stop on failure)
        if: ${{ inputs.execute }}
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python3 psi_pilot.py --execute
