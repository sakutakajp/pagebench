name: Public Chromium capture smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pagebench-public-capture-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and check syntax
        run: |
          npm ci --ignore-scripts
          npm run check
          node --check public-smoke.cjs
          node --check tests/public-smoke.test.cjs
      - name: Install standard Chromium and validate local fixtures
        run: |
          npx playwright install --with-deps chromium
          export PAGEBENCH_TEST_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npm test
      - name: Fixed three-page public capture (no sitemap or PSI)
        run: timeout 120s node public-smoke.cjs
