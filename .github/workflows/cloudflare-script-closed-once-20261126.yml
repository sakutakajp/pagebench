name: One-time closed Cloudflare Script policy browser fixture only
on:
  push:
    branches: [diag/cloudflare-script-closed-once-20261126]
    paths: [.github/workflows/cloudflare-script-closed-once-20261126.yml]
permissions:
  contents: read
concurrency:
  group: pagebench-cloudflare-script-closed-once-20261126
  cancel-in-progress: false
jobs:
  closed:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diag/cloudflare-script-closed-once-20261126' &&
      github.run_attempt == 1 &&
      github.event.created == true &&
      github.event.forced == false &&
      github.event.deleted == false &&
      github.event.head_commit.message == 'diagnostic: Cloudflare Script closed browser proof once (20261126-ab1)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Locked existing dependencies no scripts or browser download
        working-directory: tools/lighthouse-once
        run: npm ci --ignore-scripts
      - name: Closed scope and protocol tests Node24
        run: node tools/cloudflare-script-closed/unit.mjs node24 >/dev/null 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Closed scope and protocol tests Node22
        run: node tools/cloudflare-script-closed/unit.mjs node22 >/dev/null 2>&1
      - name: Exact closed admission then normal sandbox Chrome fixed memory only
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node --unhandled-rejections=strict tools/cloudflare-script-closed/entry.mjs --closed-once >/dev/null 2>&1
      - name: Fixed evidence even on failure no raw browser output
        if: always()
        run: node tools/cloudflare-script-closed/entry.mjs --publish 2>/dev/null
      - name: Fixed receipts only no raw data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-script-closed-fixed-20261126-ab1
          retention-days: 1
          if-no-files-found: error
          path: |
            cloudflare-script-closed-units.json
            cloudflare-script-closed-fixed.json
