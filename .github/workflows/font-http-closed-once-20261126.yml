name: One-time closed font HTTP and native event comparison
on:
  push:
    branches: [diag/font-http-closed-once-20261126]
    paths: [.github/workflows/font-http-closed-once-20261126.yml]
permissions:
  contents: read
concurrency:
  group: pagebench-font-http-closed-once-20261126
  cancel-in-progress: false
jobs:
  closed:
    if: >-
      github.repository == 'sakutakajp/pagebench' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diag/font-http-closed-once-20261126' &&
      github.run_attempt == 1 &&
      github.event.created == true &&
      github.event.forced == false &&
      github.event.deleted == false &&
      github.event.head_commit.message == 'diagnostic: closed font HTTP comparison once (20261126-an1)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Existing locked dependencies without scripts or browser download
        working-directory: tools/lighthouse-once
        run: npm ci --ignore-scripts
      - name: Node24 fixed component and protocol tests
        run: node tools/font-http-closed/unit.mjs node24 >/dev/null 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Node22 fixed component and protocol tests
        run: node tools/font-http-closed/unit.mjs node22 >/dev/null 2>&1
      - name: Exact one-use admission then closed native font fixture only
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node --unhandled-rejections=strict tools/font-http-closed/entry.mjs --closed-once >/dev/null 2>&1
      - name: Fixed evidence only even on failure
        if: always()
        run: node tools/font-http-closed/entry.mjs --publish 2>/dev/null
      - name: Fixed counters and classifications only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-http-closed-fixed-20261126-an1
          retention-days: 1
          if-no-files-found: error
          path: |
            font-http-units.json
            font-http-fixed.json
