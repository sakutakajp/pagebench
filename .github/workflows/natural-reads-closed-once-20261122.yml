name: One-time natural public reads closed Chrome controls
on:
  push:
    branches: [diag/natural-reads-closed-once-20261122]
    paths: [.github/workflows/natural-reads-closed-once-20261122.yml]
permissions:
  contents: read
concurrency:
  group: pagebench-natural-reads-closed-once-20261122
  cancel-in-progress: false
jobs:
  closed:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diag/natural-reads-closed-once-20261122' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'diagnostic: natural public reads closed proof (20261122-u1)'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Locked dependencies without install hooks or browser download
        working-directory: tools/lighthouse-once
        run: npm ci --ignore-scripts
      - name: Existing native-brand unit contracts
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';import {readdir,writeFile} from 'node:fs/promises';
          const groups={baseline:{files:(await readdir('tools/cdp-startup-diagnostic')).filter(x=>x.endsWith('.test.mjs')).sort().map(x=>'tools/cdp-startup-diagnostic/'+x),expected:474},AB:{files:['tools/ab-observe/test.mjs'],expected:48}};
          const result={kind:'natural-reads-unit-proof',status:'passed',sha:process.env.GITHUB_SHA,node24:process.version,groups:{}};
          for(const [name,g]of Object.entries(groups)){const r=spawnSync(process.execPath,['--test',...g.files],{encoding:'utf8',timeout:120000,maxBuffer:10485760});const c=Object.fromEntries([...r.stdout.matchAll(/(?:#|ℹ) (tests|pass|fail|skipped|cancelled) (\d+)/g)].map(m=>[m[1],Number(m[2])]));const ok=process.version==='v24.19.0'&&typeof Error.isError==='function'&&r.status===0&&c.tests===g.expected&&c.pass===g.expected&&c.fail===0&&c.skipped===0&&c.cancelled===0;result.groups[name]={status:ok?'passed':'failed',...c};if(!ok)result.status='failed';}
          await writeFile('natural-reads-unit-proof.json',JSON.stringify(result),{mode:0o600});console.log(JSON.stringify(result));if(result.status!=='passed')process.exitCode=1;
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Strict ownership binding proxy and closed-runner contracts
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';import {readFile,writeFile} from 'node:fs/promises';
          const groups={strict:{file:'strict.test.mjs',expected:27},scope:{file:'scope-fetch.test.mjs',expected:23},bound:{file:'bound-prefetch.test.mjs',expected:40},natural:{file:'natural-prefetch.test.mjs',expected:18},reads:{file:'../natural-reads/test.mjs',expected:51}};
          const result=JSON.parse(await readFile('natural-reads-unit-proof.json','utf8'));result.node22=process.version;
          for(const [name,g]of Object.entries(groups)){const r=spawnSync(process.execPath,['--unhandled-rejections=strict','--test','tools/nuxt-debug/'+g.file],{encoding:'utf8',timeout:60000,maxBuffer:1048576});const c=Object.fromEntries([...r.stdout.matchAll(/(?:#|ℹ) (tests|pass|fail|skipped|cancelled) (\d+)/g)].map(m=>[m[1],Number(m[2])]));const ok=process.version==='v22.19.0'&&r.status===0&&c.tests===g.expected&&c.pass===g.expected&&c.fail===0&&c.skipped===0&&c.cancelled===0;result.groups[name]={status:ok?'passed':'failed',...c};if(!ok)result.status='failed';}
          await writeFile('natural-reads-unit-proof.json',JSON.stringify(result),{mode:0o600});console.log(JSON.stringify(result));if(result.status!=='passed')process.exitCode=1;
          JS
      - name: Exact closed-only event source and prerequisite gate
        run: |
          node --input-type=module <<'JS'
          import{readFile,writeFile}from'node:fs/promises';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';
          let ok=false;try{const git=(...a)=>execFileSync('git',a,{encoding:'utf8',maxBuffer:1048576}).trim(),event=JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH,'utf8')),base='4270ea66ed23a951e1267a7ff420ca6336336194';
          if(process.version!=='v22.19.0'||process.env.GITHUB_REPOSITORY!=='sakutakajp/pagebench'||process.env.GITHUB_EVENT_NAME!=='push'||process.env.GITHUB_REF!=='refs/heads/diag/natural-reads-closed-once-20261122'||process.env.GITHUB_RUN_ATTEMPT!=='1'||process.env.GITHUB_SHA!==git('rev-parse','HEAD')||process.env.GITHUB_SHA!==event.head_commit?.id||git('rev-parse','HEAD^')!==base||git('rev-list','--count',base+'..HEAD')!=='1'||git('log','-1','--format=%s')!=='diagnostic: natural public reads closed proof (20261122-u1)')throw Error();
          const m=JSON.parse(await readFile('tools/natural-reads/source-manifest.json','utf8'));if(m.parent!==base||m.role!=='CLOSED_NATURAL_READS_NOT_LIVE'||JSON.stringify(git('diff','--name-only',base,'HEAD').split('\n').sort())!==JSON.stringify([...Object.keys(m.files),'tools/natural-reads/source-manifest.json'].sort()))throw Error();for(const[p,h]of Object.entries(m.files))if(createHash('sha256').update(await readFile(p)).digest('hex')!==h)throw Error();
          const p=JSON.parse(await readFile('natural-reads-unit-proof.json','utf8')),counts={baseline:474,AB:48,strict:27,scope:23,bound:40,natural:18,reads:51};if(p.kind!=='natural-reads-unit-proof'||p.status!=='passed'||p.sha!==process.env.GITHUB_SHA||p.node24!=='v24.19.0'||p.node22!=='v22.19.0'||Object.keys(p.groups).sort().join(',')!=='AB,baseline,bound,natural,reads,scope,strict'||Object.entries(counts).some(([k,n])=>p.groups[k]?.status!=='passed'||p.groups[k].tests!==n||p.groups[k].pass!==n||p.groups[k].fail!==0||p.groups[k].skipped!==0||p.groups[k].cancelled!==0))throw Error();
          await writeFile('natural-reads-one-attempt.json','{"attempt":1}',{flag:'wx',mode:0o600});ok=true;}catch{}
          console.log(JSON.stringify({kind:'natural-reads-closed-admission',status:ok?'passed':'failed',real_site_navigations:0}));if(!ok)process.exitCode=1;
          JS
      - name: One closed real Chrome comparison only
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: |
          node --unhandled-rejections=strict --input-type=module <<'JS'
          import{runClosedBrowser}from'./tools/natural-reads/browser.mjs';import{writeFile,readFile}from'node:fs/promises';
          let result;try{result=await runClosedBrowser();}catch{result={kind:'CLOSED_NATURAL_READS_NOT_LIVE',status:'failed',reason:'BROWSER_UNAVAILABLE_OR_CLOSED_FAILURE',real_site_navigations:0,score_saved:false};}
          const text=JSON.stringify(result);await writeFile('natural-reads-closed-proof.json',text,{flag:'wx',mode:0o600});if(await readFile('natural-reads-closed-proof.json','utf8')!==text)throw Error('FIXED_READBACK');console.log(text);if(result.status!=='passed')process.exitCode=1;
          JS
      - name: Fixed proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-reads-closed-fixed-proof
          retention-days: 1
          if-no-files-found: ignore
          path: |
            natural-reads-unit-proof.json
            natural-reads-closed-proof.json
