name: One-time synthetic paths real filesystem and Chrome closed proof
on:
  push:
    branches: [diag/rejected-paths-filesystem-closed-once-20261125]
    paths: [.github/workflows/rejected-paths-filesystem-closed-once-20261125.yml]
permissions:
  contents: read
concurrency:
  group: pagebench-rejected-paths-filesystem-closed-once-20261125
  cancel-in-progress: false
jobs:
  closed:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diag/rejected-paths-filesystem-closed-once-20261125' &&
      github.run_attempt == 1 &&
      github.event.created == true &&
      github.event.forced == false &&
      github.event.deleted == false &&
      github.event.head_commit.message == 'diagnostic: synthetic rejected paths real filesystem Chrome proof once (20261125-r1)'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 19
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Locked existing dependencies without hooks or browser download
        working-directory: tools/lighthouse-once
        run: npm ci --ignore-scripts
      - name: Existing and real-filesystem unit contracts on Node24
        run: |
          node tools/rejected-paths-chrome/unit.mjs node24 >/dev/null 2>&1
          node tools/rejected-paths-filesystem/unit.mjs node24 >/dev/null 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Existing and real-filesystem unit contracts on Node22
        run: |
          node tools/rejected-paths-chrome/unit.mjs node22 >/dev/null 2>&1
          node tools/rejected-paths-filesystem/unit.mjs node22 >/dev/null 2>&1
      - name: Exact source units and single-run admission
        run: node tools/rejected-paths-filesystem/admission.mjs >/dev/null 2>&1
      - name: Standard Chrome actual disk save readback failure and cleanup controls
        env:
          CHROME_PATH: /opt/google/chrome/chrome
        run: node --unhandled-rejections=strict tools/rejected-paths-filesystem/browser.mjs >/dev/null 2>&1
      - name: Fixed statuses and counters only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-paths-filesystem-closed-fixed-20261125-r1
          path: |
            rejected-paths-unit-proof.json
            rejected-paths-filesystem-units.json
            rejected-paths-filesystem-proof.json
          if-no-files-found: error
          retention-days: 1
