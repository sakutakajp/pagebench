name: Pagebench manual dry-run
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pagebench-manual-dry-run
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic checks
        run: |
          python3 -m unittest discover -s tests -v
          npm ci --ignore-scripts
          npm run check
      - name: Local screenshot-free browser fixtures
        run: |
          npx playwright install --with-deps chromium
          export PAGEBENCH_TEST_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npm test
      - name: Public sitemap and at most three planned URLs (no PSI)
        env:
          SITEMAP_URL: ${{ vars.SITEMAP_URL }}
        run: python3 manual_plan.py
