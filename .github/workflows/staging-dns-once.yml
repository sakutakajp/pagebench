name: Staging bounded Chromium smoke once
on:
  push:
    branches: [diag/staging-dns-once]
    paths: [.github/workflows/staging-dns-once.yml]
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/diag/staging-dns-once' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Playwright and standard Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: One strict staging sitemap gate
        shell: python3 {0}
        run: |
          import ipaddress,json,re,socket,ssl,signal,unicodedata
          import urllib.request,urllib.error
          from urllib.parse import urlsplit,unquote,quote
          from xml.etree import ElementTree as ET
          from html.parser import HTMLParser
          def origin(value):
              u=urlsplit(value)
              if u.scheme!='https' or not u.hostname or u.netloc!=u.hostname or u.path or u.query or u.fragment or any(c.isspace() for c in value):
                  raise ValueError('INVALID_PUBLIC_ORIGIN')
              if not re.fullmatch(r'[a-z0-9]+(?:[.-][a-z0-9]+)*',u.hostname): raise ValueError('INVALID_HOST')
              try: ipaddress.ip_address(u.hostname)
              except ValueError: pass
              else: raise ValueError('IP_ORIGIN_UNSUPPORTED')
              if '.' not in u.hostname or u.hostname.endswith(('.localhost','.local','.internal')): raise ValueError('NONPUBLIC_ORIGIN')
              return value

          def canonical(value, site):
              origin(site)
              if not isinstance(value,str) or len(value)>2048 or any(unicodedata.category(c).startswith('C') for c in value): raise ValueError('INVALID_URL')
              u=urlsplit(value)
              if u.scheme!='https' or u.netloc!=urlsplit(site).netloc or u.query or u.fragment or '?' in value or '#' in value: raise ValueError('ORIGIN_OR_QUERY')
              p=u.path
              if not p.startswith('/') or '//' in p: raise ValueError('PATH_SHAPE')
              if re.search(r'%(?![0-9A-Fa-f]{2})',p): raise ValueError('BAD_ESCAPE')
              decoded=unquote(p,encoding='utf-8',errors='strict')
              # Encoded delimiters, percent/double encoding, dot segments, controls fail closed.
              if len(decoded.split('/'))!=len(p.split('/')) or any(x in ('.','..') for x in decoded.split('/')): raise ValueError('PATH_CONFUSION')
              if any(c.isspace() for c in decoded) or any(c in decoded for c in '%\\?#') or any(unicodedata.category(c).startswith('C') for c in decoded): raise ValueError('UNSAFE_CHARACTER')
              if unicodedata.normalize('NFC',decoded)!=decoded: raise ValueError('NON_NFC')
              normalized=site+quote(decoded,safe='/-._~')
              # Accept literal Unicode or canonical upper-case escapes; reject escaped ASCII,
              # lower-case percent encodings and mixtures that obscure identity.
              if '%' in p and value!=normalized: raise ValueError('NONCANONICAL_ENCODING')
              return normalized
          SITE='https://staging.hirameki.dev'
          START=SITE+'/sitemap.xml'
          NS='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          LIMIT=4*1024*1024
          class Stop(Exception): pass
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          def fetch(url):
              if canonical(url,SITE)!=url: raise Stop('URL_INVALID')
              addresses=socket.getaddrinfo('staging.hirameki.dev',443,type=socket.SOCK_STREAM)
              if not addresses or any(not ipaddress.ip_address(a[4][0]).is_global for a in addresses): raise Stop('DNS_NONPUBLIC_OR_EMPTY')
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),urllib.request.HTTPSHandler(context=ssl.create_default_context()))
              with opener.open(url,timeout=15) as r:
                  if r.status!=200: raise Stop('HTTP_NOT_200')
                  if r.geturl()!=url: raise Stop('REDIRECT_REJECTED')
                  body=r.read(LIMIT+1)
                  if len(body)>LIMIT: raise Stop('SIZE_LIMIT')
                  return r.status,r.headers.get_content_type(),body
          def select(body):
              text=body.decode('utf-8-sig',errors='strict')
              if '<!' in text or '\x00' in text: raise Stop('UNSAFE_XML')
              root=ET.fromstring(text)
              if root.tag!=NS+'urlset': raise Stop('URLSET_REQUIRED')
              if any(not e.tag.startswith(NS) for e in root.iter()): raise Stop('MIXED_NAMESPACE')
              urls=set()
              for e in root:
                  loc=e.findall(NS+'loc')
                  if e.tag!=NS+'url' or len(loc)!=1 or len(loc[0]) or not loc[0].text: raise Stop('XML_CONTENT')
                  urls.add(canonical(loc[0].text.strip(),SITE))
                  if len(urls)>100000: raise Stop('URL_LIMIT')
              selected=sorted(u for u in urls if urlsplit(u).path!='/')[:3]
              if not selected: raise Stop('EMPTY_SAMPLE')
              return len(urls),selected
          def main():
              import os
              from pathlib import Path
              def timeout(*_): raise TimeoutError()
              signal.signal(signal.SIGALRM,timeout);signal.alarm(25)
              try:
                  status,mime,body=fetch(START)
                  count,urls=select(body)
                  if any('%' in u for u in urls): raise Stop('ENCODED_SAMPLE_NOT_IN_SMOKE_SCOPE')
                  target=Path(os.environ['RUNNER_TEMP'])/'staging-browser-scope.json'
                  with open(target,'x',opener=lambda path,flags:os.open(path,flags,0o600)) as f:
                      json.dump({'origin':SITE,'urls':urls},f)
                  print(json.dumps({'sitemap_http':status,'accepted_urls':count,'selected_count':len(urls)}))
                  return 0
              except urllib.error.HTTPError as e: print(json.dumps({'status':'stopped','http':e.code}));return 1
              except Exception: print('{"status":"stopped","reason":"SITEMAP_GATE_FAILED"}');return 1
              finally:signal.alarm(0)
          if __name__=='__main__': raise SystemExit(main())
      - name: Default-deny diagnostic Chromium smoke (no comparison)
        shell: node {0}
        timeout-minutes: 2
        run: |
          'use strict';
          const fs=require('node:fs'),path=require('node:path');
          const {chromium}=require(path.join(process.cwd(),'node_modules/playwright'));
          function category(raw){
           const u=new URL(raw),v=(u.hostname+u.pathname).toLowerCase();
           if(/googletagmanager\.com\/gtag\/|google-analytics\.com/.test(v))return 'ga4';
           if(/googletagmanager\.com/.test(v))return 'gtm';
           if(/googlesyndication\.com|doubleclick\.net|googleadservices\.com/.test(v))return 'adsense';
           return 'other';
          }
          function asset(u,type,origin){
           return u.origin===origin&&!u.search&&!u.hash&&!u.username&&!u.password&&
           ['script','stylesheet','font','image'].includes(type)&&
           /^\/_nuxt\/(?:[A-Za-z0-9_-]+\.)?[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|png|webp|avif|svg|jpe?g)$/.test(u.pathname);
          }
          function candidate(u,type,method){
           if(!['GET','HEAD'].includes(method)||type!=='image'||u.search||u.hash||u.username||u.password)return 'unclassified';
           if(['/favicon.ico','/favicon-16x16.png','/favicon-32x32.png','/favicon-48x48.png'].includes(u.pathname))return 'known_favicon_image';
           if(u.pathname==='/icon_square.png')return 'known_touch_icon_image';
           if(u.pathname==='/icon.svg')return 'known_app_icon_image';
           if(u.pathname==='/HIRAMEKI.DEV.webp')return 'known_site_logo_image';
           return 'unclassified';
          }
          async function smoke(browser,origin,targets){
           if(!targets.length||targets.length>3||new Set(targets).size!==targets.length)throw Error('SCOPE');
           for(const t of targets){const u=new URL(t);if(u.origin!==origin||u.search||u.hash||u.username||u.password)throw Error('SCOPE');}
           const summary={status:'complete',target:targets.length,attempted:0,rendered:0,pending:targets.length,pages:[],first_denied_candidate:null,blocked:{ga4:0,gtm:0,adsense:0,other:0,same_origin_unexpected:0,after_fatal:0,request_limit:0,same_origin_non_get:0,same_origin_api:0,nuxt_asset_rejected:0,same_origin_other:0,websocket:0},screenshots:0,operations:'unverified'};
           for(const target of targets){
            let fatal=null,requests=0,documents=0,documentHttp=null;
            const context=await browser.newContext({viewport:{width:412,height:823},deviceScaleFactor:1.75,locale:'ja-JP',timezoneId:'UTC',serviceWorkers:'block',acceptDownloads:false,ignoreHTTPSErrors:false});
            try{
             await context.routeWebSocket('**/*',ws=>{summary.blocked.websocket++;ws.close();});
             await context.route('**/*',async route=>{
              const r=route.request();if(fatal)summary.blocked.after_fatal++;let u;try{u=new URL(r.url());}catch{fatal=fatal||'URL_INVALID';return route.abort();}
              requests++;if(requests>120){summary.blocked.request_limit++;fatal=fatal||'REQUEST_LIMIT';return route.abort();}
              if(r.redirectedFrom()){fatal=fatal||'REDIRECT_REJECTED';return route.abort();}
              if(u.origin!==origin){if(!fatal)summary.blocked[category(u.href)]++;return route.abort();}
              const doc=r.isNavigationRequest()&&r.resourceType()==='document'&&r.frame()===page.mainFrame()&&u.href===target;
              if(fatal||!['GET','HEAD'].includes(r.method())||(!doc&&!asset(u,r.resourceType(),origin))){if(!fatal){summary.blocked.same_origin_unexpected++;
               const denied=!['GET','HEAD'].includes(r.method())?'same_origin_non_get':/^\/api(?:\/|$)/.test(u.pathname)?'same_origin_api':u.pathname.startsWith('/_nuxt/')?'nuxt_asset_rejected':'same_origin_other';
               summary.blocked[denied]++;if(summary.first_denied_candidate===null)summary.first_denied_candidate=denied==='same_origin_other'?candidate(u,r.resourceType(),r.method()):'not_other';}fatal=fatal||'SAME_ORIGIN_UNEXPECTED';return route.abort();}
              if(doc&&++documents>1){fatal=fatal||'REPEATED_DOCUMENT';return route.abort();}
              try{
               const response=await route.fetch({maxRedirects:0,maxRetries:0,timeout:10000});
               if(doc)documentHttp=response.status();
               if(response.status()>=300&&response.status()<400){fatal=fatal||'REDIRECT_REJECTED';await response.dispose();return route.abort();}
               if(doc&&response.status()!==200){fatal=fatal||(response.status()===403?'HTTP_403':'HTTP_NOT_200');await response.dispose();return route.abort();}
               await route.fulfill({response});await response.dispose();
              }catch{fatal=fatal||'FETCH_FAILED';await route.abort();}
             });
             const page=await context.newPage();
             page.on('dialog',d=>d.dismiss());
             summary.attempted++;summary.pending--;
             let response;
             try{response=await page.goto(target,{waitUntil:'domcontentloaded',timeout:15000});}
             catch{fatal=fatal||'NAVIGATION_FAILED';}
             const http=response?response.status():documentHttp;
             if(http!==200)fatal=fatal||(http===403?'HTTP_403':'HTTP_NOT_200');
             if(!fatal&&!(response.headers()['content-type']||'').toLowerCase().startsWith('text/html'))fatal='NOT_HTML';
             if(!fatal){await page.waitForTimeout(1000);}
             let visible=null,heading=null;
             if(!fatal){const info=await page.evaluate(()=>{const visible=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden';};return {body:visible(document.body)&&Boolean(document.body.innerText.trim()),heading:[...document.querySelectorAll('h1,h2,[role="heading"]')].some(visible)};});visible=info.body;heading=info.heading;if(!visible||!heading)fatal=fatal||'BASIC_RENDER_MISSING';}
             if(fatal){visible=null;heading=null;}
             summary.pages.push({ordinal:summary.attempted,http,visible_body:visible,visible_heading:heading,status:fatal||'rendered'});
             if(fatal){summary.status='stopped';break;}summary.rendered++;
            }catch{summary.status='stopped';summary.pages.push({ordinal:summary.attempted,status:fatal||'BROWSER_ERROR'});break;}
            finally{await context.close();}
           }
           return summary;
          }
          module.exports={smoke,asset,category};
          async function main(){
           const scope=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'staging-browser-scope.json'),'utf8'));
           if(scope.origin!=='https://staging.hirameki.dev'||!Array.isArray(scope.urls)||scope.urls.some(u=>u.includes('%')||u!==new URL(u).href))throw Error('SCOPE');
           const browser=await chromium.launch();let result;try{result=await smoke(browser,scope.origin,scope.urls);}finally{await browser.close();}
           console.log(JSON.stringify(result));return result.status==='complete'?0:1;
          }
          if(require.main===module)main().then(c=>{process.exitCode=c;}).catch(()=>{console.log('{"status":"stopped","reason":"DIAGNOSTIC_ERROR"}');process.exitCode=1;});
      - name: Remove private scope
        if: always()
        run: rm -f "$RUNNER_TEMP/staging-browser-scope.json"
